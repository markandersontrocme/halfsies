name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create on main, like v0.1.0
        required: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # A pushed v1.2.3 tag, or a manual run with tag v1.2.3, releases version 1.2.3.
      # Other builds are 0.0.0 and publish nothing.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            tag=$INPUT_TAG
            if [[ $GITHUB_REF != refs/heads/main ]]; then
              echo "::error::Run the release from main, not $GITHUB_REF"
              exit 1
            fi
            if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The tag must look like v1.2.3, got '$tag'"
              exit 1
            fi
            if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
              echo "::error::Tag $tag already exists"
              exit 1
            elif [[ $out != *"HTTP 404"* ]]; then
              echo "::error::Could not check whether tag $tag exists: $out"
              exit 1
            fi
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
          fi
          version=0.0.0
          [[ -z $tag ]] || version=${tag#v}
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test package
        run: swift test --package-path HalfsiesKit

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: scripts/package.sh "$VERSION" "$BUILD"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          path: build/package/Halfsies-${{ steps.version.outputs.version }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          path: build/package/release-notes.md
          archive: false
          if-no-files-found: error

  # Runs on every build so pull requests check the downloaded files; only a release tag publishes.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ZIP: Halfsies-${{ needs.build.outputs.version }}.zip
    steps:
      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ZIP }}
          path: dist
          skip-decompress: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes.md
          path: dist

      - name: Check files
        run: |
          ls -l dist
          unzip -l "dist/$ZIP" | grep -q ' Halfsies.app/Contents/MacOS/Halfsies$'
          cat dist/release-notes.md

      # Creates the tag on the built commit when a manual run asked for a new one.
      - name: Publish prerelease
        if: needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >
          gh release create "$TAG" "dist/$ZIP"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --prerelease
          --title "Halfsies $VERSION"
          --notes-file dist/release-notes.md
          --generate-notes
