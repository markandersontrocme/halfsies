name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test package
        run: swift test --package-path HalfsiesKit

      - name: Generate project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build app
        run: >
          xcodebuild -project Halfsies.xcodeproj -scheme Halfsies -configuration Release
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
